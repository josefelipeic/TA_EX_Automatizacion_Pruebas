name: CI
on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 17 y cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar pruebas unitarias
        run: mvn -B clean test
      - name: Ejecutar pruebas de integracion y empaquetar
        run: mvn -B verify
      - name: Publicar reportes y JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_number }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/automatizacion-pruebas-ta.jar
          if-no-files-found: warn
